name: Production SSH Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-ssh:
    name: Verify production SSH and document root
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_HOST: premium106.web-hosting.com
      PRODUCTION_USER: rakilluy
      PRODUCTION_PATH: /home/rakilluy/greenlightinduction.rakibhasaan.com
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_DEPLOY_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_DEPLOY_SSH_KNOWN_HOSTS }}
      PRODUCTION_SSH_PORT: "21098"
    steps:
      - name: Validate required SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_KNOWN_HOSTS; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Required production SSH secret is missing: ${variable}"
              exit 1
            fi
          done
          echo 'Required production SSH configuration is present.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare ephemeral SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          umask 077
          case "$PRODUCTION_HOST" in
            *://*|*/*|*:* ) echo '::error::PRODUCTION_HOST must be a hostname or IP without scheme, path, or port'; exit 1 ;;
          esac
          printf '%s' "$PRODUCTION_HOST" | sha256sum | sed 's/ .*$//' | sed 's/^/SSH host value hash: /' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$HOME/.ssh/slate_deploy_github"
          chmod 600 "$HOME/.ssh/slate_deploy_github"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo '::error::SSH host-key scan returned no host key.'; exit 1; }
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Run read-only server inspection
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/slate_deploy_github" \
            -o BatchMode=yes \
            -p "$PRODUCTION_SSH_PORT" \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          printf 'SSH authentication: success\n'
          printf 'Remote user: '; id -un
          printf 'Home directory: '; printf '%s\n' "$HOME"
          printf 'Document-root candidates:\n'
          for path in \
            "$HOME/greenlightinduction.rakibhasaan.com" \
            "$HOME/greenlightinduction.rakibhasaan.com/slate" \
            "$HOME/public_html" \
            "$HOME/public_html/slate"; do
            if [ -e "$path" ]; then
              printf '  %s exists\n' "$path"
              if [ -f "$path/mcp.php" ]; then
                sha256sum "$path/mcp.php" | sed 's#  .*#  mcp.php#'
              fi
            else
              printf '  %s absent\n' "$path"
            fi
          done
          printf 'PHP version: '; php -v 2>/dev/null | head -1 || printf 'unavailable\n'
          REMOTE

      - name: Remove ephemeral SSH identity
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/slate_deploy_github" "$HOME/.ssh/known_hosts"
