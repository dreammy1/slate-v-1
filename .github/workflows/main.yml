name: Slate CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Deployment behavior for manual verification
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy
      deployment_target:
        description: Environment targeted by a manual deployment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: slate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: "1"
  MYSQL_DATABASE: slate_test
  MYSQL_USER: slate
  MYSQL_PASSWORD: slate
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  DB_NAME: slate_test
  DB_USER: slate
  DB_PASS: slate
  DB_HOST: 127.0.0.1
  DB_CHARSET: utf8mb4
  APP_URL: http://127.0.0.1:8080/slate
  APP_SECRET: ci-only-secret
  CRON_SECRET: ci-only-cron-secret
  TENANT_ID: "1"

jobs:
  quality-checks:
    name: PHP lint, dependency validation, and asset checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, zip, openssl, fileinfo, curl, gd, pdo_mysql
          tools: composer
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              echo "PHP syntax error: $file"
              failed=1
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0)
          exit "$failed"

      - name: Run PHPStan when configured
        if: hashFiles('phpstan.neon', 'phpstan.neon.dist') != ''
        run: |
          composer install --prefer-dist --no-progress
          vendor/bin/phpstan analyse --no-progress

      - name: Run JavaScript and CSS lint when configured
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run build --if-present

  php-tests:
    name: PHP tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: slate_test
          MYSQL_USER: slate
          MYSQL_PASSWORD: ${{ secrets.WP_TEST_DB_PASSWORD || 'slate' }}
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_PASS: ${{ secrets.WP_TEST_DB_PASSWORD || 'slate' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, openssl, fileinfo, curl, gd, pdo_mysql
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Initialize the CI database
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot slate_test < db/schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot slate_test < plugins/content-builder/install.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot slate_test -e "INSERT INTO plugins (slug, name, version, status, manifest_json) VALUES ('content-builder', 'Content Builder', '1.6.1', 'active', '{\"slug\":\"content-builder\",\"name\":\"Content Builder\",\"version\":\"1.6.1\"}') ON DUPLICATE KEY UPDATE status='active', version='1.6.1', manifest_json=VALUES(manifest_json);"
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot slate_test -e "INSERT IGNORE INTO contentbuilder_posts (tenant_id, type, title, slug, status, layout, published_at) VALUES (1, 'page', 'Home', 'home', 'published', '[]', NOW());"

      - name: Run Slate test suite
        run: bash tests/run.sh

  security-checks:
    name: Security checks
    needs: [quality-checks, php-tests]
    if: ${{ always() && needs.quality-checks.result == 'success' && needs.php-tests.result == 'success' }}
    uses: ./.github/workflows/security.yml
    with:
      run_dependency_review: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

  e2e-tests:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs: [quality-checks, php-tests, security-checks]
    if: ${{ always() && needs.quality-checks.result == 'success' && needs.php-tests.result == 'success' && needs.security-checks.result == 'success' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: slate_test
          MYSQL_USER: slate
          MYSQL_PASSWORD: ${{ secrets.WP_TEST_DB_PASSWORD || 'slate' }}
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_PASS: ${{ secrets.WP_TEST_DB_PASSWORD || 'slate' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, zip, openssl, fileinfo, curl, gd, pdo_mysql
          tools: composer
          coverage: none

      - name: Initialize the E2E database
        run: mysql --protocol=tcp -h 127.0.0.1 -uroot -proot slate_test < db/schema.sql

      - name: Start Slate server
        run: |
          nohup php -S 127.0.0.1:8080 tests/e2e/router.php > /tmp/slate-e2e-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/admin/login.php >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/slate-e2e-server.log
          exit 1

      - name: Install browser test dependencies
        if: hashFiles('tests/e2e/**', 'playwright.config.*') != ''
        run: npm ci

      - name: Install Playwright Chromium
        if: hashFiles('tests/e2e/**', 'playwright.config.*') != ''
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite when present
        if: hashFiles('tests/e2e/**', 'playwright.config.*') != ''
        run: npm run test:e2e

      - name: Report E2E suite status
        if: hashFiles('tests/e2e/**', 'playwright.config.*') == ''
        run: |
          echo 'No Playwright/Cypress suite is currently present in this repository.'
          echo 'The E2E job is intentionally green but skipped until tests/e2e is added.'

  package:
    name: Build release artifact
    runs-on: ubuntu-latest
    needs: [quality-checks, php-tests, security-checks, e2e-tests]
    if: ${{ always() && needs.quality-checks.result == 'success' && needs.php-tests.result == 'success' && needs.security-checks.result == 'success' && needs.e2e-tests.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, zip, openssl, fileinfo, curl, gd, pdo_mysql
          tools: composer
          coverage: none

      - name: Build frontend assets when configured
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build --if-present

      - name: Create clean application ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then version="main-${GITHUB_SHA::7}"; fi
          mkdir -p dist/slate
          rsync -a ./ dist/slate/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --include '.env.example' \
            --exclude '.env.*' \
            --exclude 'tests/' \
            --exclude 'scratchpad/' \
            --exclude 'uploads/' \
            --exclude '*.log' \
            --exclude 'error_log' \
            --exclude '*.bak' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'plugins/_dist/'
          (cd dist && zip -qr "slate-v${version}.zip" slate)
          echo "artifact=dist/slate-v${version}.zip" >> "$GITHUB_OUTPUT"
        id: bundle

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: slate-release-${{ github.ref_name }}
          path: ${{ steps.bundle.outputs.artifact }}
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.bundle.outputs.artifact }}" --generate-notes --verify-tag

  deploy-staging:
    name: Deploy main to staging
    runs-on: ubuntu-latest
    needs: package
    if: ${{ needs.package.result == 'success' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'staging')) }}
    environment: staging
    env:
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_USER: ${{ vars.STAGING_USER }}
      STAGING_PATH: ${{ vars.STAGING_PATH }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
      DEPLOY_MAX_SECONDS: ${{ vars.DEPLOY_MAX_SECONDS || '600' }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: slate-release-${{ github.ref_name }}
          path: dist
      - name: Check staging deployment configuration
        id: staging-config
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$STAGING_HOST" ] && [ -n "$STAGING_USER" ] && [ -n "$STAGING_PATH" ] && [ -n "$STAGING_SSH_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Staging server credentials are not configured; deployment was not attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify staging artifact in dry-run mode
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'dry-run'
        run: |
          set -euo pipefail
          unzip -l dist/*.zip
          test -s dist/*.zip
          echo 'Staging dry-run passed; no server connection was attempted.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy over SSH with rsync
        if: (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'deploy') && steps.staging-config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$STAGING_PATH" && test -n "$STAGING_SSH_KEY"
          start_time=$(date +%s)
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
          rm -rf /tmp/slate-staging
          mkdir -p /tmp/slate-staging
          unzip -q dist/*.zip -d /tmp/slate-staging
          rsync -az --delete -e 'ssh -i ~/.ssh/id_ed25519' /tmp/slate-staging/slate/ "$STAGING_USER@$STAGING_HOST:$STAGING_PATH/"
          duration=$(( $(date +%s) - start_time ))
          echo "### Staging deployment telemetry\n- Duration: ${duration}s\n- Threshold: ${DEPLOY_MAX_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$duration" -gt "$DEPLOY_MAX_SECONDS" ]; then
            echo "::warning title=Slow staging deployment::Deployment took ${duration}s (threshold: ${DEPLOY_MAX_SECONDS}s)"
            if [ -n "$DEPLOY_ALERT_WEBHOOK" ]; then
              curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' \
                --data "{\"text\":\"Slate staging deployment was slow: ${duration}s (threshold ${DEPLOY_MAX_SECONDS}s), run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
                "$DEPLOY_ALERT_WEBHOOK" || echo 'Slow-deployment alert could not be delivered.'
            fi
          fi

      - name: Alert on staging deployment failure
        if: failure() && env.DEPLOY_ALERT_WEBHOOK != ''
        run: |
          curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"Slate staging deployment failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DEPLOY_ALERT_WEBHOOK" || echo 'Failure alert could not be delivered.'

  deploy-production:
    name: Deploy version tag to production
    runs-on: ubuntu-latest
    needs: package
    if: ${{ needs.package.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'deploy' && inputs.deployment_target == 'production')) }}
    environment: production
    env:
      PRODUCTION_FTPS_HOST: ${{ secrets.PRODUCTION_FTPS_HOST }}
      PRODUCTION_FTPS_USER: ${{ secrets.PRODUCTION_FTPS_USER }}
      PRODUCTION_FTPS_PASSWORD: ${{ secrets.PRODUCTION_FTPS_PASSWORD }}
      PRODUCTION_FTPS_SERVER_DIR: ${{ secrets.PRODUCTION_FTPS_SERVER_DIR || './' }}
      DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
      DEPLOY_MAX_SECONDS: ${{ vars.DEPLOY_MAX_SECONDS || '600' }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: slate-release-${{ github.ref_name }}
          path: dist
      - name: Check production FTPS configuration
        id: production-ftps-config
        if: github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for variable in PRODUCTION_FTPS_HOST PRODUCTION_FTPS_USER PRODUCTION_FTPS_PASSWORD PRODUCTION_FTPS_SERVER_DIR; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Required production FTPS secret is missing: ${variable}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Production FTPS preflight failed; no server connection was attempted.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo 'Production FTPS preflight passed; required values are present.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production artifact in dry-run mode
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'dry-run'
        run: |
          set -euo pipefail
          unzip -l dist/*.zip
          test -s dist/*.zip
          echo 'Production dry-run passed; no server connection was attempted.' >> "$GITHUB_STEP_SUMMARY"

      - name: Extract production artifact
        if: (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'deploy') && steps.production-ftps-config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/slate-production
          mkdir -p /tmp/slate-production
          unzip -q dist/*.zip -d /tmp/slate-production

      - name: Deploy over explicit FTPS
        if: (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'deploy') && steps.production-ftps-config.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.PRODUCTION_FTPS_HOST }}
          username: ${{ env.PRODUCTION_FTPS_USER }}
          password: ${{ env.PRODUCTION_FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: /tmp/slate-production/slate/
          server-dir: ${{ env.PRODUCTION_FTPS_SERVER_DIR }}/
          state-name: .slate-ftp-deploy-sync-state.json
          log-level: minimal
          exclude: |
            **/.git*
            **/.github/**
            **/.env
            **/.env.*
            **/tests/**
            **/uploads/**
            **/*.log
            **/error_log
            **/*.bak
            **/node_modules/**
            **/dist/**
            **/plugins/_dist/**

      - name: Record production FTPS telemetry
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'deploy')
        run: |
          echo '### Production deployment telemetry' >> "$GITHUB_STEP_SUMMARY"
          echo '- Transport: Explicit FTPS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Server connection completed through the FTPS deployment action.' >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on production deployment failure
        if: failure() && env.DEPLOY_ALERT_WEBHOOK != ''
        run: |
          curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"Slate production deployment failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DEPLOY_ALERT_WEBHOOK" || echo 'Failure alert could not be delivered.'

  deploy-cpanel-production:
    name: Deploy validated main to cPanel
    runs-on: ubuntu-latest
    needs: package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success' }}
    environment: production
    concurrency:
      group: cpanel-production-deploy
      cancel-in-progress: false
    env:
      CPANEL_HOST: ${{ vars.CPANEL_HOST || 'premium106.web-hosting.com' }}
      CPANEL_PORT: ${{ vars.CPANEL_PORT || '21098' }}
      CPANEL_USER: ${{ vars.CPANEL_USER || 'rakilluy' }}
      CPANEL_REPOSITORY_ROOT: ${{ vars.CPANEL_REPOSITORY_ROOT || '/home/rakilluy/repositories/slate-v-1' }}
      CPANEL_DEPLOY_HEALTH_URL: ${{ vars.CPANEL_DEPLOY_HEALTH_URL || 'https://greenlightinduction.rakibhasaan.com/' }}
      CPANEL_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_DEPLOY_SSH_PRIVATE_KEY }}
      CPANEL_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate cPanel deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in CPANEL_HOST CPANEL_PORT CPANEL_USER CPANEL_REPOSITORY_ROOT CPANEL_DEPLOY_HEALTH_URL CPANEL_DEPLOY_SSH_PRIVATE_KEY CPANEL_DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing production deployment configuration: ${variable}"
              exit 1
            fi
          done
          case "$CPANEL_HOST" in
            *://*|*/*|*:* ) echo '::error::CPANEL_HOST must be a hostname only.'; exit 1 ;;
          esac
          case "$CPANEL_PORT" in
            *[!0-9]*|'' ) echo '::error::CPANEL_PORT must be numeric.'; exit 1 ;;
          esac
          case "$CPANEL_REPOSITORY_ROOT" in
            /home/*/repositories/* ) ;;
            * ) echo '::error::CPANEL_REPOSITORY_ROOT must be a cPanel repository path.'; exit 1 ;;
          esac

      - name: Prepare pinned SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$CPANEL_DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/cpanel_deploy"
          printf '%s\n' "$CPANEL_DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cpanel_deploy"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Pull and deploy cPanel-managed repository
        id: cpanel-deploy
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(ssh -i "$HOME/.ssh/cpanel_deploy" -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" "bash -s -- '$CPANEL_REPOSITORY_ROOT' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          repository_root="$1"
          expected_sha="$2"
          test -d "$repository_root/.git" || { echo 'The configured cPanel repository does not exist.' >&2; exit 1; }
          test -z "$(git -C "$repository_root" status --porcelain)" || { echo 'The cPanel repository has uncommitted changes; refusing deployment.' >&2; exit 1; }
          git -C "$repository_root" fetch --prune origin main
          git -C "$repository_root" merge --ff-only origin/main
          test "$(git -C "$repository_root" rev-parse HEAD)" = "$expected_sha" || { echo 'The cPanel repository did not reach the validated GitHub commit.' >&2; exit 1; }
          deployment_result="$(uapi --output=json VersionControlDeployment create repository_root="$repository_root")"
          printf '%s\n' "$deployment_result"
          printf '%s' "$deployment_result" | grep -Eq '"status"[[:space:]]*:[[:space:]]*1' || { echo 'The cPanel deployment task reported a failure.' >&2; exit 1; }
          git -C "$repository_root" rev-parse HEAD
          REMOTE
          )"
          printf 'deployed_sha=%s\n' "$(printf '%s\n' "$deployed_sha" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Verify the public application
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 "$CPANEL_DEPLOY_HEALTH_URL" > /dev/null
          echo "### cPanel deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.cpanel-deploy.outputs.deployed_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: $CPANEL_DEPLOY_HEALTH_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/cpanel_deploy" "$HOME/.ssh/known_hosts"
